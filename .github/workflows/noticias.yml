name: Robot de noticias (cada 30 min)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/noticias.json"]

permissions:
  contents: write

concurrency:
  group: robot-noticias
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Foto de vista previa (si falta)
        run: |
          if [ ! -f img/og.jpg ]; then
            pip install --quiet pillow
            for u in \
              "https://www.lapatria.com/sites/default/files/styles/opengraph_1200x630/public/noticia/2026-11/Icetex.jpeg" \
              "https://www.universidad.edu.co/wp-content/uploads/2026/11/icetexpresidencia.jpg"; do
              if curl -sfL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124" -o /tmp/og-src.jpg "$u" && \
                 python3 -c "from PIL import Image, ImageOps; ImageOps.fit(Image.open('/tmp/og-src.jpg').convert('RGB'), (1200,630)).save('img/og.jpg', quality=84)"; then
                echo "Foto lista desde $u"; break
              fi
            done
          fi

      - name: Traer noticias reales
        run: node scripts/actualizar-noticias.mjs

      - name: Guardar cambios
        run: |
          git config user.name "robot-vibras"
          git config user.email "robot-vibras@users.noreply.github.com"
          git add data/noticias.json img/og.jpg 2>/dev/null || git add data/noticias.json
          git diff --cached --quiet || git commit -m "Robot: noticias $(TZ=America/Bogota date '+%Y-%m-%d %H:%M')"
          git push
